<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="vl-vert-grad" x1="15%" y1="90%" x2="85%" y2="10%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="25%" stop-color="#A78BFA" />
      <stop offset="55%" stop-color="#38BDF8" />
      <stop offset="80%" stop-color="#2FE695" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>

    <filter id="vl-vert-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" opacity="0.6" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Top Emblem -->
  <g transform="translate(40, 10) scale(1)" filter="url(#vl-vert-glow)">
    <!-- 1. Left V-Wing -->
    <path
      d="M 52 50 C 58 48, 70 48, 76 62 L 104 135"
      stroke="url(#vl-vert-grad)"
      stroke-width="13"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- 2. Bottom Loop -->
    <path
      d="M 104 135 C 98 152, 78 160, 64 148 C 50 136, 56 112, 70 96"
      stroke="url(#vl-vert-grad)"
      stroke-width="11"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- 3. Center Pod Stem -->
    <path
      d="M 104 135 L 140 58"
      stroke="url(#vl-vert-grad)"
      stroke-width="13"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- 4. Pod Mouthpiece & Outer Contour -->
    <path
      d="M 88 155 L 148 76 C 152 70, 160 58, 154 48 L 148 38 C 144 32, 134 30, 128 34 L 118 46 C 112 52, 112 60, 116 68 L 105 92"
      stroke="url(#vl-vert-grad)"
      stroke-width="11"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- 5. Collar Notch -->
    <path
      d="M 125 56 L 146 68"
      stroke="url(#vl-vert-grad)"
      stroke-width="7"
      stroke-linecap="round"
    />
  </g>

  <!-- Bottom Wordmark "VAPELAB" in wide futuristic bold typeface -->
  <g transform="translate(140, 215)">
    <text
      x="0"
      y="0"
      text-anchor="middle"
      fill="#FFFFFF"
      font-family="system-ui, -apple-system, sans-serif"
      font-size="28"
      font-weight="900"
      letter-spacing="5"
    >VAPELAB</text>
  </g>
</svg>
