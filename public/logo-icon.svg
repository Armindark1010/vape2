<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Brand Gradient: Soft Violet to Electric Mint -->
    <linearGradient id="vl-icon-grad" x1="10%" y1="90%" x2="90%" y2="10%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="25%" stop-color="#A78BFA" />
      <stop offset="55%" stop-color="#38BDF8" />
      <stop offset="80%" stop-color="#2FE695" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="vl-icon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" opacity="0.65" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#vl-icon-glow)">
    <!-- 1. Left V-Wing with rounded top bevel -->
    <path
      d="M 52 50 C 58 48, 70 48, 76 62 L 104 135"
      stroke="url(#vl-icon-grad)"
      stroke-width="13"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- 2. Bottom Loop & Base Cradle -->
    <path
      d="M 104 135 C 98 152, 78 160, 64 148 C 50 136, 56 112, 70 96"
      stroke="url(#vl-icon-grad)"
      stroke-width="11"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- 3. Pod Center Stem & Inner V Angle -->
    <path
      d="M 104 135 L 140 58"
      stroke="url(#vl-icon-grad)"
      stroke-width="13"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- 4. Pod Right Outer Shell and Ergonomic Mouthpiece -->
    <path
      d="M 88 155 L 148 76 C 152 70, 160 58, 154 48 L 148 38 C 144 32, 134 30, 128 34 L 118 46 C 112 52, 112 60, 116 68 L 105 92"
      stroke="url(#vl-icon-grad)"
      stroke-width="11"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- 5. Cartridge Collar Separation Notch -->
    <path
      d="M 125 56 L 146 68"
      stroke="url(#vl-icon-grad)"
      stroke-width="7"
      stroke-linecap="round"
    />
  </g>
</svg>
